<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Viola - backend e tecnologia</title>
  <desc id="desc">Banner em pixel art com selva, um aventureiro e um dragão animado.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#4c1d10"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff7ae"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#60a5fa" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g fill="#f8fafc" opacity=".7">
    <rect x="85" y="55" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="340" y="78" width="3" height="3"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="1030" y="42" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <circle cx="1030" cy="75" r="42" fill="#fbbf24" opacity=".12" filter="url(#glow)"/>
  <circle cx="1030" cy="75" r="25" fill="#fde68a" opacity=".85"/>

  <g fill="#06120d">
    <path d="M0 240L80 195l35 30 65-85 52 92 65-55 50 68 80-100 70 95 72-70 78 75 72-58 60 58 90-105 55 92 62-65 52 75 92-82 90 110v70H0Z"/>
    <path d="M0 265l90-58 50 42 72-35 55 40 86-68 55 67 82-34 65 42 90-75 60 70 75-41 82 49 95-60 60 52 90-33 113 52v45H0Z" fill="#0b271a"/>
  </g>

  <g transform="translate(885 112)" shape-rendering="crispEdges">
    <animateTransform attributeName="transform" type="translate" values="885 112;840 94;885 112" dur="5s" repeatCount="indefinite"/>
    <path d="M0 44h18V28h18V12h26v12h18V8h18v18h26v16h-18v14h-20v18H68V60H48v20H30V62H12Z" fill="#166534"/>
    <path d="M36 30h24V16h20v18h22v14H76v14H52V48H36Z" fill="#22c55e"/>
    <rect x="72" y="28" width="6" height="6" fill="#fde047"/>
    <path d="M14 40L-30 16-12 52-42 66 8 62ZM92 28l45-26-26 43 33 9-50 8Z" fill="#15803d">
      <animate attributeName="d" values="M14 40L-30 16-12 52-42 66 8 62ZM92 28l45-26-26 43 33 9-50 8Z;M14 40L-35 35-8 55-36 82 8 62ZM92 28l48 7-29 18 31 28-48-19Z;M14 40L-30 16-12 52-42 66 8 62ZM92 28l45-26-26 43 33 9-50 8Z" dur=".7s" repeatCount="indefinite"/>
    </path>
    <path d="M124 40l28 8-28 9Z" fill="url(#fire)" filter="url(#glow)">
      <animate attributeName="opacity" values="0;1;.45;0" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values=".2 1;1.4 1;.2 1" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(105 150)" shape-rendering="crispEdges">
    <rect x="32" y="12" width="34" height="38" fill="#d6a26e"/>
    <rect x="25" y="18" width="48" height="9" fill="#991b1b"/>
    <rect x="66" y="21" width="22" height="5" fill="#ef4444"/>
    <rect x="22" y="50" width="54" height="58" fill="#365314"/>
    <rect x="31" y="60" width="36" height="10" fill="#854d0e"/>
    <rect x="10" y="55" width="16" height="50" fill="#d6a26e"/>
    <rect x="76" y="55" width="16" height="48" fill="#d6a26e"/>
    <rect x="30" y="108" width="17" height="48" fill="#1f2937"/>
    <rect x="54" y="108" width="17" height="48" fill="#1f2937"/>
    <rect x="26" y="151" width="24" height="9" fill="#111827"/>
    <rect x="52" y="151" width="24" height="9" fill="#111827"/>
    <path d="M80 62h54v8H80zM126 56h14v20h-14z" fill="#334155"/>
  </g>

  <g font-family="monospace" fill="#f8fafc">
    <text x="245" y="138" font-size="34" font-weight="700">FELIPE ANDRADE VIOLA</text>
    <text x="245" y="178" font-size="20" fill="#fbbf24">BACKEND • SISTEMAS • AUTOMAÇÃO</text>
    <text x="245" y="215" font-size="17" fill="#cbd5e1">C  C++  C#  JAVA  GIT</text>
    <text x="245" y="250" font-size="15" fill="#86efac">&gt; construindo soluções para problemas reais</text>
    <rect x="690" y="237" width="10" height="18" fill="#86efac">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
