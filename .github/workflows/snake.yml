name: Gerar animação das contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da trilha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f59e0b&color_dots=%23ebedf0,%23fde68a,%23f59e0b,%23ea580c,%23991b1b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23fbbf24&color_dots=%23161512,%237c2d12,%23c2410c,%23f59e0b,%23fef3c7

      - name: Publicar animações
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
